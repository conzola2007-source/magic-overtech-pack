# Loyal Companions configuration
# Singleplayer/integrated-server settings. Chance values are from 0.0 to 1.0.
# Changes take effect after a restart. Invalid values fall back to the default and values outside
# the range are clamped. Ids like minecraft:wolf are written as they are, without escaping.

# ==================== Team and archive ====================

# Team slots per player. Every bound companion takes one slot, whether it is out in the world or stored.
# Range: 1 to 6. Default: 3
max_companions_per_player=1

# How many companions of the team may be out in the world at the same time.
# While the limit is reached, another one can only come out after one is stored.
# Never more than max_companions_per_player.
# Range: 1 to 6. Default: 1
max_active_companions=1

# Places in each player's archive, a long-term storage for companions that are not in the team.
# 0 switches the archive off. Range: 0 to 54. Default: 12
archive_size=12

# ==================== Leveling and rarity ====================

# Highest level a companion can reach. Every level gives one skill point.
# Range: 1 to 999. Default: 50
max_companion_level=50

# Chance that a newly bound companion is Enhanced: a bit smaller, with nine bonus inventory slots from level 20.
# Range: 0.0 (never) to 1.0 (always). Default: 0.1
enhanced_companion_chance=0.1

# Chance that a newly bound companion is Rare (bonus skill points). Normal is whatever chance is left.
# The three rarity chances together should stay at or below 1.0. Range: 0.0 to 1.0. Default: 0.1
rarity_rare_chance=0.1

# Chance that a newly bound companion is Epic (more bonus skill points).
# Range: 0.0 to 1.0. Default: 0.04
rarity_epic_chance=0.04

# Chance that a newly bound companion is Legendary (the most bonus skill points).
# Range: 0.0 to 1.0. Default: 0.01
rarity_legendary_chance=0.01

# Turns the species abilities on or off (for example Lucky Paws of the fox or Loyal Heart of the wolf).
# Values: true or false. Default: true
species_abilities_enabled=true

# Companion level at which its species ability starts to work.
# Range: 1 to 999. Default: 10
ability_unlock_level=10

# Item that resetting the skill points costs (Settings tab of the companion menu), as an item id.
# Leave it empty to make resetting free. Players in creative mode never pay. Default: minecraft:diamond
respec_item=minecraft:diamond

# How many of respec_item a reset costs. 0 makes resetting free.
# Range: 0 to 64. Default: 1
respec_item_count=1

# ==================== Companion candies ====================

# Turns Companion Candies on or off. Candies give a companion free skill points without leveling.
# Values: true or false. Default: true
companion_candy_enabled=true

# Most skill points a single companion can receive from candies in total.
# Range: 0 to 9999. Default: 100
max_candy_bonus_points=100

# Chance that the Ender Dragon drops a Companion Candy (+1 skill point).
# Range: 0.0 to 1.0. Default: 1.0
dragon_companion_candy_drop_chance=1.0

# Chance that the Ender Dragon drops a Greater Companion Candy (+2 skill points).
# Range: 0.0 to 1.0. Default: 0.35
dragon_greater_candy_drop_chance=0.35

# Chance that the Ender Dragon drops a Legendary Companion Candy (+5 skill points).
# Range: 0.0 to 1.0. Default: 0.1
dragon_legendary_candy_drop_chance=0.1

# Adds candies, Crimson Labyrinth Gems and Wayfinder Amulets to dungeon, mineshaft, jungle temple
# and desert temple chests. Only affects chests that are generated after the change.
# Values: true or false. Default: true
dungeon_candy_loot_enabled=true

# Adds candies to Ancient City chests. Only affects chests that are generated after the change.
# Values: true or false. Default: true
deep_dark_candy_loot_enabled=true

# ==================== Fighting, falling and revival ====================

# Distance in blocks around the player in which a companion on Protect attacks monsters.
# Range: 4 to 64. Default: 10
protect_mode_radius=10

# Distance in blocks around the companion in which the hunting behaviors (Monsters, All mobs) look for targets.
# Range: 4 to 64. Default: 16
aggressive_mode_radius=16

# true: a companion that falls in battle leaves a Companion Totem; with a Companion Heart it can be
# revived at a Companion Shrine. false: a fallen companion is lost for good.
# Values: true or false. Default: true
companion_revive_enabled=true

# Chance that a killed Iron Golem drops a Companion Heart, which is needed to revive a fallen companion.
# Range: 0.0 to 1.0. Default: 0.4
companion_heart_drop_chance=0.4

# Allows companions to collect items into their inventory. Players still switch it on per companion.
# Values: true or false. Default: true
item_pickup_enabled=true

# ==================== Which mobs can be bound ====================

# By default every mob that is not a monster can become a companion.
# Comma separated mob ids that can always be bound, even monsters.
# Example: minecraft:zombie_horse,minecraft:skeleton. Default: empty
companion_entity_whitelist=saintsdragons:raevyx,saintsdragons:stegonaut,saintsdragons:cindervane,saintsdragons:varasuchus,saintsdragons:ignivorus,saintsdragons:volitans,saintsdragons:nulljaw

# Comma separated mob ids that can never be bound. Wins over the whitelist.
# Example: minecraft:villager. Default: empty
companion_entity_blacklist=

# ==================== Food ====================

# Sets the food of any mob. Entries are separated by ; and each entry is the mob id, =, and the food items
# separated by |. A first part without a colon is shown in the menu instead of the item names.
# Example: minecraft:wolf=minecraft:bone|minecraft:cooked_beef;examplemod:deer=Apples and carrots|minecraft:apple|minecraft:carrot
# Default: empty (every mob eats its usual food)
companion_food_overrides=
